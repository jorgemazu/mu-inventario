name: datos
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualizar inventario
        env:
          FARM_TOKEN: ${{ secrets.FARM_TOKEN }}
          PAGE_KEY: ${{ secrets.PAGE_KEY }}
        run: node sync-datos.js
      - name: Publicar
        run: |
          git config user.name "jorgemazu"
          git config user.email "farmboss@users.noreply.github.com"
          git add datos.enc
          git diff --cached --quiet && exit 0
          git commit -m "Actualiza el inventario"
          git push
